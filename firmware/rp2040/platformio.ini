; PlatformIO 构建 RP2040 组合 HID 固件
; 用法: pio run -t upload （Pico 按住 BOOTSEL 插入 USB）
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
; TinyUSB 栈（组合 HID 必需）
board_build.core = earlephilhower
build_flags =
    -DUSE_TINYUSB
    -DUSB_VID=0x239A
    -DUSB_PID=0x8105
    -DUSB_MANUFACTURER='"autogame"'
    -DUSB_PRODUCT='"HID Bridge"'
lib_deps =
    adafruit/Adafruit TinyUSB Library
monitor_speed = 115200
