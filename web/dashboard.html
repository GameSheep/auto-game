<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autogame 监控台</title>
<style>
  :root { --bg:#0f1216; --panel:#171c23; --fg:#d8dde3; --accent:#4fc3f7; --ok:#66bb6a; --warn:#ffb74d; --bad:#ef5350; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--panel); border-bottom:1px solid #2a313b; position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; letter-spacing:1px; }
  #state-badge { padding:2px 12px; border-radius:12px; font-weight:600; background:#333; }
  .st-PAUSED{background:#455a64;} .st-SCANNING{background:#1b5e20;} .st-APPROACHING{background:#e65100;}
  .st-COOLDOWN{background:#37474f;} .st-PANIC{background:var(--bad);color:#fff;}
  .st-RECOVERING{background:#6a1b9a;color:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  main { display:grid; grid-template-columns: 1fr 340px; gap:14px; padding:14px; max-width:1400px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid #2a313b; border-radius:10px; padding:12px; }
  #stream { width:100%; border-radius:8px; background:#000; min-height:420px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button { padding:7px 16px; border:1px solid #3a4350; border-radius:8px; background:#222a33; color:var(--fg); cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.danger { background:#3e2020; border-color:#7f2d2d; }
  button.primary { background:#173450; border-color:#2a6f9e; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:4px 8px; border-bottom:1px solid #232a33; }
  .kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kpi div { background:#1d242d; border-radius:8px; padding:8px; text-align:center; }
  .kpi b { display:block; font-size:20px; color:var(--accent); }
  #events { height:210px; overflow-y:auto; font:12px/1.6 Consolas, monospace; }
  #events div { border-bottom:1px dashed #222a33; padding:1px 0; }
  input { padding:7px 10px; border:1px solid #3a4350; border-radius:8px; background:#0d1117; color:var(--fg); width:100%; }
  .muted { color:#8a939f; font-size:12px; }
  .tok { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>🎮 autogame</h1>
  <span id="state-badge" class="st-PAUSED">PAUSED</span>
  <span class="muted" id="frame-info">-</span>
  <span style="flex:1"></span>
  <a href="/settings" style="color:var(--accent); text-decoration:none">⚙️ 设置</a>
  <span class="muted">Token <input id="token" type="password" placeholder="粘贴 token（同 .token 文件）" style="width:220px"></span>
</header>
<main>
  <div class="panel">
    <img id="stream" alt="检测画面流">
    <div class="row">
      <button class="primary" onclick="ctl('start')">▶ 启动</button>
      <button onclick="ctl('stop')">⏸ 暂停</button>
      <button class="danger" onclick="ctl('panic')">⛔ 急停</button>
      <button onclick="ctl('reset')">♻ 复位</button>
      <span class="muted" id="ws-msg">画面流需 token（输入框填好后自动刷新）</span>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="kpi">
        <div><b id="k-picks">0</b>拾取</div>
        <div><b id="k-abandons">0</b>放弃</div>
        <div><b id="k-taps">0</b>按A</div>
      </div>
      <div class="kpi" style="margin-top:8px">
        <div><b id="k-nav">0</b>导航步</div>
        <div><b id="k-rc">0</b>再挑战</div>
        <div><b id="k-list">0</b>列表点击</div>
      </div>
      <table style="margin-top:10px">
        <tr><th>执行器</th><td id="exec-backend">-</td></tr>
        <tr><th>已发送</th><td id="exec-sent">-</td></tr>
        <tr><th>已丢弃(限速)</th><td id="exec-dropped">-</td></tr>
        <tr><th>急停状态</th><td id="exec-panic">-</td></tr>
        <tr><th>场景光柱</th><td id="sc-pillars">-</td></tr>
        <tr><th>A框</th><td id="sc-aframe">-</td></tr>
        <tr><th>掉落列表</th><td id="sc-list">-</td></tr>
        <tr><th>加载/过场</th><td id="sc-loading">-</td></tr>
        <tr><th>门禁</th><td id="sc-gate">-</td></tr>
        <tr><th>帧差</th><td id="sc-delta">-</td></tr>
      </table>
    </div>
    <div class="panel" style="margin-top:14px">
      <b>自主恢复</b>
      <table style="margin-top:6px">
        <tr><th>卡壳判定</th><td id="au-verdict">-</td></tr>
        <tr><th>恢复等级</th><td id="au-level">-</td></tr>
        <tr><th>恢复循环</th><td id="au-cycle">-</td></tr>
        <tr><th>视觉模型</th><td id="au-vlm">-</td></tr>
        <tr><th>视觉建议</th><td id="au-vlm-advice">-</td></tr>
        <tr><th>文本顾问</th><td id="au-llm">-</td></tr>
        <tr><th>拟人化</th><td id="au-human">-</td></tr>
        <tr><th>帧间隔</th><td id="au-frame">-</td></tr>
      </table>
    </div>
    <div class="panel" style="margin-top:14px">
      <b>事件流</b>
      <div id="events"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let pollTimer = null;
function tok() { return encodeURIComponent($("token").value.trim()); }
function ctl(action) {
  fetch(`/api/control/${action}`, {method:"POST", headers:{"X-Token": tok()}})
    .then(r => r.json()).then(j => { if(j.error) alert(j.error); refresh(); })
    .catch(e => alert("控制失败: " + e));
}
function refresh() {
  fetch(`/api/state?token=${tok()}`)
    .then(r => { if (r.status===401) throw new Error("token 无效"); return r.json(); })
    .then(d => {
      const st = d.state || "PAUSED";
      $("state-badge").textContent = st;
      $("state-badge").className = "st-" + st;
      $("k-picks").textContent = d.stats.picks;
      $("k-abandons").textContent = d.stats.abandons;
      $("k-taps").textContent = d.stats.a_taps;
      $("k-nav").textContent = d.stats.nav_moves || 0;
      $("k-rc").textContent = d.stats.rechallenges || 0;
      $("k-list").textContent = d.stats.list_clicks || 0;
      $("exec-backend").textContent = d.executor.backend;
      $("exec-sent").textContent = d.executor.sent;
      $("exec-dropped").textContent = d.executor.dropped;
      $("exec-panic").textContent = d.executor.panicked ? "已急停!" : "正常";
      const sc = d.scene;
      $("sc-pillars").textContent = sc ? sc.pillars.length : "-";
      $("sc-aframe").textContent = sc && sc.aframe ? `(${sc.aframe.x},${sc.aframe.y})` : "无";
      $("sc-list").textContent = sc ? `条目x${(sc.item_list || []).length}` : "-";
      $("sc-loading").textContent = sc && sc.loading ? "加载中(保持不动)" : "正常";
      $("sc-gate").textContent = sc ? (sc.in_game ? "战斗(放行)" : "非战斗(拦截)") : "-";
      $("frame-info").textContent = d.frame_seq ? `帧 #${d.frame_seq}` : "等待画面...";
      // 自主恢复状态
      const au = d.autonomy || {};
      const sig = au.signals || {};
      const rec = au.recovery || {};
      $("au-verdict").textContent = au.enabled
        ? `${sig.verdict || "-"}（冻结${sig.frozen_for||0}s / 空闲${sig.idle_for||0}s / 停滞${sig.stall_for||0}s）`
        : "已关闭";
      $("au-level").textContent = rec.active
        ? `L${rec.level} ${rec.step}（${rec.reason}）`
        : `待机（已执行 ${(au.stats||{}).recoveries||0} 次恢复）`;
      $("au-cycle").textContent = `${rec.cycle||0} 轮 / 步数 ${rec.steps_done||0}`;
      const vlm = au.vlm || {};
      $("au-vlm").textContent = vlm.enabled
        ? `${vlm.provider}/${vlm.model}${vlm.tripped ? " [熔断中]" : ""} 调用${(vlm.stats||{}).ok||0}/${(vlm.stats||{}).calls||0}`
        : "未启用（config.yaml: decision.vlm.enabled）";
      const adv = vlm.last_advice;
      $("au-vlm-advice").textContent = adv
        ? `${adv.action}${adv.valid ? "" : "(未采纳)"} ${adv.reason||adv.why||""}`.slice(0, 60)
        : "-";
      const llm = au.llm || {};
      $("au-llm").textContent = llm.enabled
        ? `${llm.model} 咨询${llm.queries||0}次`
        : "未启用";
      // 拟人化：疲劳度 / 走神 / 休息 / 偏好（降短期统计风险，不是安全方案）
      const hu = au.humanize || {};
      const mo = hu.mood || {};
      $("au-human").textContent = hu.enabled
        ? `疲劳${Math.round((hu.fatigue||0)*100)}% 延时x${hu.latency_scale||1}`
          + ` 走神${hu.drifts||0} 休息${hu.breaks||0}${hu.breaking ? " [休息中]" : ""}`
          + (mo.patience != null
              ? ` | 耐心${mo.effective ? mo.effective.patience : mo.patience}`
                + ` 贪心${mo.effective ? mo.effective.greed : mo.greed}`
              : "")
        : "已关闭（config.yaml: decision.humanize.enabled）";
      $("au-frame").textContent = d.frame_stalled
        ? `⚠ 中断 ${d.frame_gap_s}s`
        : (d.frame_gap_s == null ? "-" : `${d.frame_gap_s}s`);
      const ev = $("events");
      ev.innerHTML = (d.events || []).slice().reverse()
        .map(e => `<div><span class="tok">${new Date(e.ts*1000).toLocaleTimeString()}</span> [${e.state}] ${e.event}${e.reason? " ("+e.reason+")":""}</div>`).join("");
    })
    .catch(e => { $("ws-msg").textContent = "状态获取失败: " + e.message; });
}
function refreshStream() {
  if (!$("token").value.trim()) return;
  $("stream").src = `/api/stream.mjpg?token=${tok()}&t=${Date.now()}`;
  $("ws-msg").textContent = "";
}
$("token").addEventListener("change", () => { localStorage.setItem("ag_token", $("token").value); refreshStream(); });
$("token").value = localStorage.getItem("ag_token") || "";
refreshStream();
refresh();
pollTimer = setInterval(refresh, 1000);
</script>
</body>
</html>
