name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # opencv-python 在无桌面的 ubuntu runner 上需要这两个系统库（否则 import cv2 直接失败）
      - name: System libs (opencv)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python -V
          python -c "import cv2, numpy, fastapi; print('cv2', cv2.__version__)"

      # 覆盖率门槛只在 CI 生效：低于 78% 直接红（本地跑单个文件不会被误判）
      - name: Run tests (with coverage gate)
        run: python -m pytest -q --cov-fail-under=78

  preflight:
    name: 部署自检（dryrun，无显示环境）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # opencv-python 在无桌面的 ubuntu runner 上需要这两个系统库（否则 import cv2 直接失败）
      - name: System libs (opencv)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0

      - run: pip install -r requirements.txt
      # 无显示器时跳过屏幕试抓；校验配置/依赖/模板资产/执行器后端
      - name: preflight
        run: python tools/preflight.py --skip-capture --json
