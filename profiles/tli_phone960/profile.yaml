# 火炬之光：无限 · 手机端录屏（960x432）
#
# 状态 partial：已标定「战斗 HUD 正向锚点（右下技能轮盘）」与「异界星图反例」，
# 还缺背包/角色面板/结算这三类界面的反例。缺反例的风险很具体：暗黑4 开装备面板时
# 血球和技能栏都还在，只靠"有没有 HUD"判不出来，点一下就等于换装/洗点。
#
# 怎么补：截图丢进 inbox/ → 在 deliveries.md 写"这张该判成什么" →
#   py -3.12 tools/profile_init.py --profile tli_phone960
# 会出分数表 + 待办清单 + 现成的裁模板命令。

id: tli_phone960
name: 火炬之光：无限 · 手机端录屏 960x432
game: 火炬之光：无限 (Torchlight Infinite)
status: partial
reference_resolution: [960, 432]

config:
  vision:
    # 检测缩放上限：源就是 960 宽，不必再缩
    max_detect_width: 960

    scene_gate:
      # 锚点匹配区域 = 右下技能轮盘。**必须显式给**：默认 ROI 是"底部 35% 全宽"，
      # 那是 PC ARPG 的假设（技能栏横在底部）；手机端技能在右下角，用默认 ROI
      # 会把 640,255 起的那块裁掉一半，分数从 0.99 掉到 0.3，看起来像"模板不管用"。
      roi: [600, 235, 360, 197]

    # 下面这些框是我从 assets/ref/tli_combat_01.jpg 一张图上目测出来的，
    # 还没有第二张不同场景的图验证过 → 所以你最好眼校一遍（页面"相机标定"能看框）。
    # 坐标基准 = 960x432（上面的 reference_resolution）。
    hud_exclusions:
      - [0, 0, 200, 215]       # 左上：小地图 + 任务追踪 + FPS
      - [95, 245, 120, 125]    # 左下：虚拟摇杆
      - [0, 372, 575, 60]      # 左下：世界聊天文字
      - [320, 365, 300, 45]    # 底部中央：生命/护盾/伤害数字
      - [630, 245, 280, 150]   # 右下：技能轮盘（4 个技能 + 普攻）
      - [605, 18, 345, 45]     # 右上：Buff / 任务栏
      - [725, 62, 225, 28]     # 右上：平台水印
      - [650, 388, 300, 44]    # 右下：时间戳水印
      - [440, 62, 110, 65]     # 顶部中央：Boss 血条 + 倒计时

    # 光柱相关阈值一律先不动。960 宽下光柱比 1280 更细，
    # pillar_min_area/min_width 很可能要放宽——但没有一张"确实有光柱"的 960 图，
    # 改了也只是猜。等 inbox 里有光柱图，用 tools/profile_init.py 量出实际像素再定。

  # 技能轮盘的按钮位置（拾取/交互时点这里）。没标定前不要打开，留空。
  # item_list:
  #   enabled: false
